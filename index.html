<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>
    <link rel="stylesheet" href="./css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/img/ensolarado.png" type="image/x-icon">

</head>

<body>
    <header>
        <h1 id="nometitulo">Carregendo Cidade...</h1>
        <div class="boxcenter">

            <div id="inptdiv">
                <input id="nomedacidade" type="text" placeholder="Nome da Cidade">
                <input id="bottoncidade" type="button" value="Pesquisar">
            </div>
            
        </div>
        <ion-icon class="icon" name="earth-outline" onclick="abridiv()"></ion-icon>
    </header>
    <main >
        <section id="main">
            <div class="imgbackgro">

                <div class="climaatual">
                    <h2 class="tituloclima">Hoje:</h2>
                    <img id="imgclimacentral" src="" alt="">
                    <h2 id="estadoatual">Parcialmente Nublado</h2>
                    <h2 id="temperatura">35 ºC</h2>
                </div>

                <div class="climasdias">
                    <div class="dias">
                        <h2 id="dianome">humidade</h2>
                        <img id="imgclimadias" src="/img/umidade.png" alt="">
                        <h3 id="temperaturadia"></h3>
                    </div>

                    <div class="dias">
                        <h2>Temperatura Mínima</h2>
                        <img id="imgclimadias" src="/img/minima.png" alt="">
                        <h3 id="temperaturaminima" ></h3>
                    </div>

                    <div class="dias">
                        <h2>Temperatura Máxima</h2>
                        <img id="imgclimadias" src="/img/maxima.png" alt="">
                        <h3 id="temperaturamaxima" ></h3>
                    </div>

                    <div class="dias">
                        <h2>Velocidade do Vento</h2>
                        <img id="imgclimadias" src="/img/vento.png" alt="">
                        <h3 id="ventovelocidade" ></h3>
                    </div>
                </div>

            </div>
           

        </section>
    </main>


    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script src="/js/divinpt.js"></script>

    <script src="/js/Api.js"></script>

</body>

</html>
